<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="LibraryManagermentSystem">
  <title>LibraryManagermentSystem</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F6FEB"/>
      <stop offset="1" stop-color="#58A6FF"/>
    </linearGradient>
    <clipPath id="plate">
      <rect width="1200" height="280" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect x="0" y="0" width="8" height="280" fill="url(#rail)"/>
    <circle cx="1080" cy="60" r="150" fill="#58A6FF" opacity="0.07"/>
    <circle cx="120" cy="250" r="110" fill="#1F6FEB" opacity="0.06"/>
  </g>
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="64" y="112" font-family="Inter, 'Segoe UI', 'Noto Sans CJK SC', system-ui, sans-serif"
        font-size="58" font-weight="700" fill="#f0f6fc" letter-spacing="-0.5">LibraryManagermentSystem</text>
  <text x="64" y="176" font-family="Inter, 'Segoe UI', 'Noto Sans CJK SC', system-ui, sans-serif"
        font-size="27" font-weight="400" fill="#8b949e">图书管理：客户端不碰数据库，全部走接口</text>
  <rect x="64" y="204" width="46" height="4" rx="2" fill="#58A6FF"/>
  <text x="64" y="248" font-family="ui-monospace, 'Cascadia Code', Consolas, monospace"
        font-size="19" font-weight="400" fill="#6e7681">WinForms  ·  ASP.NET Core 8  ·  EF Core  ·  SQL Server</text>
</svg>
